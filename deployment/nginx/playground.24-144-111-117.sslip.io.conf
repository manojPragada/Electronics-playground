server {
    server_name playground.24-144-111-117.sslip.io;

    client_max_body_size 25m;
    auth_basic "Pinloom private playground";
    auth_basic_user_file /etc/nginx/playground.htpasswd;

    location /api/local-projects {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Parts defined over MCP (pinloom-mcp.service writes this file). Until the
    # first part is defined the file does not exist and the build's own copy is served.
    location = /parts/index.json {
        root /var/lib/pinloom-parts;
        try_files /index.json @shipped_parts;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location @shipped_parts {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP over HTTPS for Claude Code. Its own login (not the site's), SSE needs
    # buffering off and long timeouts, and the SDK only accepts a local Host header.
    location /mcp/ {
        auth_basic "Pinloom MCP";
        auth_basic_user_file /etc/nginx/pinloom-mcp.htpasswd;
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8002;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        error_page 502 503 504 = @deploying;
    }

    location @deploying {
        default_type text/plain;
        add_header Retry-After 60 always;
        return 503 "Pinloom playground deployment in progress.\n";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/playground.24-144-111-117.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/playground.24-144-111-117.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = playground.24-144-111-117.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name playground.24-144-111-117.sslip.io;
    return 404; # managed by Certbot


}